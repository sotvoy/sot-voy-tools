<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator - Free Online Lorem Ipsum</title>
    <meta name="description" content="Generate placeholder text for your designs. Free online Lorem Ipsum generator.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/lorem-ipsum-generator.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">
</head>
<body>
    <div class="bg-shapes"><div class="bg-shape bg-shape-1"></div><div class="bg-shape bg-shape-2"></div><div class="bg-shape bg-shape-3"></div></div>
    <header class="header">
        <div class="container"><div class="header-inner">
            <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
            <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
            <div class="header-actions"><div class="theme-toggle-wrap"><button class="theme-toggle"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button><div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div></div><button class="mobile-menu-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
        </div></div>
    </header>
    <div class="mobile-menu"><a href="#tools" class="mobile-nav-link">Tools</a><a href="#categories" class="mobile-nav-link">Categories</a><div class="mobile-theme-options"><button class="mobile-theme-btn" data-theme="system">System</button><button class="mobile-theme-btn" data-theme="light">Light</button><button class="mobile-theme-btn" data-theme="dark">Dark</button></div></div>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container" style="max-width: 700px;">
                <div class="tool-header"><h1>Lorem Ipsum Generator</h1><p>Generate placeholder text for your designs</p></div>
                <div class="tool-content">
                    <div class="form-group"><label>Number of paragraphs</label><input type="number" id="paras" value="3" min="1" max="20" oninput="generate()"></div>
                    <button class="tool-btn" onclick="generate()">Generate Lorem Ipsum</button>
                    <div style="margin-top: 16px;">
                        <textarea id="output" class="tool-textarea" readonly></textarea>
                        <div class="tool-stats"><span id="charCount">Characters: 0</span></div>
                    </div>
                    <div class="tool-actions"><button class="tool-btn" onclick="copy()">Copy to Clipboard</button></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer-simple"><div class="container"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        const lorem = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";
        function generate() {
            const n = parseInt(document.getElementById('paras').value) || 1;
            const text = Array(n).fill(lorem).join('\n\n');
            document.getElementById('output').value = text;
            document.getElementById('charCount').textContent = 'Characters: ' + text.length;
        }
        function copy() { navigator.clipboard.writeText(document.getElementById('output').value); }
        generate();
    </script>
</body>
</html>
