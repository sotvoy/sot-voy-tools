<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Free Secure Password Creator</title>
    <meta name="description" content="Generate strong, secure passwords instantly. Free online password generator with customizable options.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/password-generator.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-page { padding: 40px 0; }
        .tool-container { max-width: 600px; margin: 0 auto; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
        .tool-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; }
        .password-display { display: flex; gap: 12px; margin-bottom: 24px; }
        .password-output { flex: 1; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-family: monospace; font-size: 18px; word-break: break-all; }
        .tool-btn { padding: 16px 24px; background: var(--gradient-primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; width: 100%; }
        .tool-btn:hover { opacity: 0.9; }
        .options { margin-top: 24px; }
        .option { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .option:last-child { border-bottom: none; }
        .option label { font-weight: 500; }
        .option input[type="range"] { width: 150px; }
        .length-value { font-weight: 700; color: var(--primary); }
        .strength-meter { margin-top: 20px; }
        .strength-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .strength-fill { height: 100%; transition: width 0.3s, background 0.3s; }
        .strength-text { margin-top: 8px; font-weight: 500; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop">
                    <a href="../index.html#tools" class="nav-link">Tools</a>
                    <a href="../index.html#categories" class="nav-link">Categories</a>
                </nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme">
                            <svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        </button>
                        <div class="theme-dropdown">
                            <button class="theme-option active" data-theme="system">System</button>
                            <button class="theme-option" data-theme="light">Light</button>
                            <button class="theme-option" data-theme="dark">Dark</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Password Generator</h1><p>Create strong, secure passwords instantly</p></div>
                <div class="tool-content">
                    <div class="password-display">
                        <div class="password-output" id="passwordOutput">Click Generate</div>
                        <button class="tool-btn" style="width:auto;" onclick="generatePassword()">Generate</button>
                    </div>
                    <div class="options">
                        <div class="option">
                            <label>Password Length: <span class="length-value" id="lengthValue">16</span></label>
                            <input type="range" id="lengthSlider" min="8" max="64" value="16" oninput="updateLength()">
                        </div>
                        <div class="option">
                            <label>Uppercase (A-Z)</label>
                            <input type="checkbox" id="uppercase" checked>
                        </div>
                        <div class="option">
                            <label>Lowercase (a-z)</label>
                            <input type="checkbox" id="lowercase" checked>
                        </div>
                        <div class="option">
                            <label>Numbers (0-9)</label>
                            <input type="checkbox" id="numbers" checked>
                        </div>
                        <div class="option">
                            <label>Symbols (!@#$%)</label>
                            <input type="checkbox" id="symbols" checked>
                        </div>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <div class="strength-text" id="strengthText">Click Generate</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div>
        </div>
    </footer>

    <script src="../js/theme.js"></script>
    <script>
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const passwordOutput = document.getElementById('passwordOutput');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        function updateLength() {
            lengthValue.textContent = lengthSlider.value;
        }

        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lower = 'abcdefghijklmnopqrstuvwxyz';
            const nums = '0123456789';
            const syms = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            let charset = '';
            if (document.getElementById('uppercase').checked) charset += upper;
            if (document.getElementById('lowercase').checked) charset += lower;
            if (document.getElementById('numbers').checked) charset += nums;
            if (document.getElementById('symbols').checked) charset += syms;
            
            if (!charset) {
                passwordOutput.textContent = 'Select at least one option';
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            
            passwordOutput.textContent = password;
            calculateStrength(password);
        }

        function calculateStrength(password) {
            let score = 0;
            if (password.length >= 8) score += 1;
            if (password.length >= 12) score += 1;
            if (password.length >= 16) score += 1;
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^a-zA-Z0-9]/.test(password)) score += 1;

            const colors = ['#dc2626', '#f59e0b', '#22c55e', '#16a34a'];
            const texts = ['Weak', 'Fair', 'Good', 'Strong'];
            const idx = Math.min(3, Math.floor(score / 2));
            
            strengthFill.style.width = ((score / 7) * 100) + '%';
            strengthFill.style.background = colors[idx];
            strengthText.textContent = texts[idx];
            strengthText.style.color = colors[idx];
        }
    </script>
</body>
</html>
