<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator - Free Online Calculator</title>
    <meta name="description" content="Calculate tips quickly and easily. Free online tip calculator.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/tip-calculator.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">
</head>
<body>
    <div class="bg-shapes"><div class="bg-shape bg-shape-1"></div><div class="bg-shape bg-shape-2"></div><div class="bg-shape bg-shape-3"></div></div>
    <header class="header">
        <div class="container"><div class="header-inner">
            <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
            <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
            <div class="header-actions"><div class="theme-toggle-wrap"><button class="theme-toggle"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button><div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div></div><button class="mobile-menu-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
        </div></div>
    </header>
    <div class="mobile-menu"><a href="#tools" class="mobile-nav-link">Tools</a><a href="#categories" class="mobile-nav-link">Categories</a><div class="mobile-theme-options"><button class="mobile-theme-btn" data-theme="system">System</button><button class="mobile-theme-btn" data-theme="light">Light</button><button class="mobile-theme-btn" data-theme="dark">Dark</button></div></div>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Tip Calculator</h1><p>Calculate tip and split the bill</p></div>
                <div class="tool-content">
                    <div class="form-group"><label>Bill Amount ($)</label><input type="number" id="bill" placeholder="50" oninput="calculate()"></div>
                    <div class="form-group"><label>Tip Percentage</label><input type="number" id="tip" value="15" oninput="calculate()"></div>
                    <div class="form-group"><label>Number of People</label><input type="number" id="people" value="1" min="1" oninput="calculate()"></div>
                    <div class="result">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left;">
                            <div><div class="result-label">Tip Amount</div><div class="result-value" id="tipAmount" style="font-size: 18px;">$0</div></div>
                            <div><div class="result-label">Total</div><div class="result-value" id="total" style="font-size: 18px;">$0</div></div>
                        </div>
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
                            <div class="result-label">Per Person</div>
                            <div class="result-value" id="perPerson" style="font-size: 24px;">$0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer-simple"><div class="container"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        function calculate() {
            const bill = parseFloat(document.getElementById('bill').value) || 0;
            const tipPct = parseFloat(document.getElementById('tip').value) || 0;
            const people = parseInt(document.getElementById('people').value) || 1;
            const tip = bill * tipPct / 100;
            const total = bill + tip;
            const perPerson = total / people;
            document.getElementById('tipAmount').textContent = '$' + tip.toFixed(2);
            document.getElementById('total').textContent = '$' + total.toFixed(2);
            document.getElementById('perPerson').textContent = '$' + perPerson.toFixed(2);
        }
        calculate();
    </script>
</body>
</html>
