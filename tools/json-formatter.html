<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - Free Online JSON Validator</title>
    <meta name="description" content="Format, validate, and beautify your JSON data online. Free JSON formatter and validator tool.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/json-formatter.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-page { padding: 60px 0; min-height: 100vh; }
        .tool-container { max-width: 900px; margin: 0 auto; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
        .tool-header p { color: var(--text-secondary); font-size: 16px; }
        
        .tool-content { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-xl); 
            padding: 24px;
            box-shadow: var(--shadow);
        }
        
        .tool-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
        }
        
        .tool-textarea { 
            width: 100%; 
            min-height: 200px; 
            padding: 16px; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            font-family: 'Monaco', 'Consolas', monospace; 
            font-size: 14px; 
            color: var(--text); 
            resize: vertical;
            transition: var(--transition);
            line-height: 1.6;
        }
        
        .tool-textarea:focus { 
            outline: none; 
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        
        .tool-textarea::placeholder { color: var(--text-muted); }
        
        .tool-output { 
            margin-top: 20px;
        }
        
        .tool-stats { 
            display: flex; 
            gap: 12px; 
            margin-top: 16px; 
            flex-wrap: wrap; 
        }
        
        .tool-stat { 
            padding: 10px 16px; 
            background: var(--surface-hover); 
            border-radius: var(--radius); 
            font-size: 13px;
            font-weight: 500;
        }
        
        .tool-stat.error { 
            background: #fef2f2; 
            color: #dc2626; 
            border: 1px solid #fecaca;
        }
        
        .tool-stat.valid { 
            background: #f0fdf4; 
            color: #16a34a; 
            border: 1px solid #bbf7d0;
        }
        
        .tool-actions { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px; 
            flex-wrap: wrap; 
        }
        
        .tool-btn { 
            padding: 12px 24px; 
            background: var(--gradient-primary); 
            color: white; 
            border: none; 
            border-radius: var(--radius); 
            font-weight: 600; 
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .tool-btn:hover { 
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow-sm);
        }
        
        .tool-btn.secondary { 
            background: var(--surface-hover); 
            color: var(--text); 
            border: 1px solid var(--border); 
        }
        
        .tool-btn.secondary:hover { 
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .tool-btn svg {
            width: 16px;
            height: 16px;
        }
        
        .options-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .option-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }
        
        @media (max-width: 768px) { 
            .tool-content { padding: 16px; }
            .tool-actions { flex-direction: column; }
            .tool-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop">
                    <a href="../index.html#tools" class="nav-link">Tools</a>
                    <a href="../index.html#categories" class="nav-link">Categories</a>
                </nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme">
                            <svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        </button>
                        <div class="theme-dropdown">
                            <button class="theme-option active" data-theme="system">System</button>
                            <button class="theme-option" data-theme="light">Light</button>
                            <button class="theme-option" data-theme="dark">Dark</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>JSON Formatter</h1><p>Format, validate, and beautify your JSON data</p></div>
                <div class="tool-content">
                    <textarea id="jsonInput" class="tool-textarea" placeholder='{"example": "Paste your JSON here..."}'></textarea>
                    <div class="tool-stats" id="jsonStats">
                        <div class="tool-stat" id="jsonStatus">Enter JSON to validate</div>
                    </div>
                    <div class="tool-actions">
                        <button class="tool-btn" onclick="formatJSON()">Format</button>
                        <button class="tool-btn" onclick="minifyJSON()">Minify</button>
                        <button class="tool-btn secondary" onclick="validateJSON()">Validate</button>
                        <button class="tool-btn secondary" onclick="clearJSON()">Clear</button>
                        <button class="tool-btn secondary" onclick="copyJSON()">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div>
        </div>
    </footer>

    <script src="../js/theme.js"></script>
    <script>
        const jsonInput = document.getElementById('jsonInput');
        const jsonStatus = document.getElementById('jsonStatus');

        function formatJSON() {
            try {
                const parsed = JSON.parse(jsonInput.value);
                jsonInput.value = JSON.stringify(parsed, null, 2);
                setStatus(true, 'Valid JSON - Formatted');
            } catch (e) {
                setStatus(false, 'Invalid JSON: ' + e.message);
            }
        }

        function minifyJSON() {
            try {
                const parsed = JSON.parse(jsonInput.value);
                jsonInput.value = JSON.stringify(parsed);
                setStatus(true, 'Valid JSON - Minified');
            } catch (e) {
                setStatus(false, 'Invalid JSON: ' + e.message);
            }
        }

        function validateJSON() {
            try {
                JSON.parse(jsonInput.value);
                setStatus(true, 'Valid JSON');
            } catch (e) {
                setStatus(false, 'Invalid JSON: ' + e.message);
            }
        }

        function setStatus(valid, message) {
            jsonStatus.textContent = message;
            jsonStatus.className = 'tool-stat ' + (valid ? 'valid' : 'error');
        }

        function clearJSON() {
            jsonInput.value = '';
            setStatus(true, 'Enter JSON to validate');
        }

        function copyJSON() {
            navigator.clipboard.writeText(jsonInput.value);
        }
    </script>
</body>
</html>
