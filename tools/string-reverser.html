<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Reverser - Reverse Text Online</title>
    <meta name="description" content="Reverse any string of text instantly. Flip text forwards or backwards.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/string-reverser.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        <div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>String Reverser</h1><p>Reverse any text instantly</p></div>
                <div class="tool-content">
                    <div class="form-group">
                        <label class="tool-label">Input Text</label>
                        <textarea id="inputText" class="tool-textarea" placeholder="Enter text to reverse..." oninput="reverseText()"></textarea>
                    </div>
                    <div class="tool-actions">
                        <button class="tool-btn secondary" onclick="reverseText()">Reverse</button>
                        <button class="tool-btn secondary" onclick="clearText()">Clear</button>
                        <button class="tool-btn secondary" onclick="copyOutput()">Copy</button>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <label class="tool-label">Reversed Text</label>
                        <textarea id="outputText" class="tool-textarea" readonly placeholder="Reversed text will appear here..."></textarea>
                    </div>
                    <div class="tool-stats">
                        <div class="tool-stat"><div class="tool-stat-value" id="charCount">0</div><div class="tool-stat-label">Characters</div></div>
                        <div class="tool-stat"><div class="tool-stat-value" id="wordCount">0</div><div class="tool-stat-label">Words</div></div>
                    </div>
                </div>
                <div class="tool-info"><h3>Use Cases</h3><ul><li>Reversing strings for programming</li><li>Creating mirrored text</li><li>Text puzzles and games</li><li>Testing string manipulation</li></ul></div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        function reverseText() {
            const input = document.getElementById('inputText').value;
            document.getElementById('outputText').value = input.split('').reverse().join('');
            document.getElementById('charCount').textContent = input.length;
            document.getElementById('wordCount').textContent = input.trim() === '' ? 0 : input.trim().split(/\s+/).length;
        }
        function clearText() { document.getElementById('inputText').value = ''; reverseText(); }
        function copyOutput() { navigator.clipboard.writeText(document.getElementById('outputText').value); }
    </script>
</body>
</html>
