<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech - Convert Text to Audio</title>
    <meta name="description" content="Convert text to speech using browser's built-in speech synthesis. Free online TTS tool.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/text-to-speech.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">
    <style>
        .tool-container { max-width: 600px; margin: 0 auto; }
        .voice-select { margin-bottom: 16px; }
        .controls-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        <div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Text to Speech</h1><p>Convert text to spoken audio</p></div>
                <div class="tool-content">
                    <div class="form-group voice-select">
                        <label class="tool-label">Voice</label>
                        <select id="voiceSelect" class="tool-select"></select>
                    </div>
                    <div class="controls-row">
                        <div class="form-group" style="flex:1;min-width:100px;">
                            <label class="tool-label">Speed</label>
                            <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" style="width:100%">
                        </div>
                        <div class="form-group" style="flex:1;min-width:100px;">
                            <label class="tool-label">Pitch</label>
                            <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1" style="width:100%">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="tool-label">Text to speak</label>
                        <textarea id="textInput" class="tool-textarea" placeholder="Enter text here..."></textarea>
                    </div>
                    <div class="tool-actions">
                        <button class="tool-btn" onclick="speak()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
                            Speak
                        </button>
                        <button class="tool-btn secondary" onclick="stop()">Stop</button>
                        <button class="tool-btn secondary" onclick="clearText()">Clear</button>
                    </div>
                </div>
                <div class="tool-info"><h3>About Text to Speech</h3><p>Uses the browser's built-in Web Speech API to convert text to spoken audio. Works in Chrome, Edge, Safari, and other modern browsers.</p></div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        const synth = window.speechSynthesis;
        let voices = [];
        function loadVoices() { voices = synth.getVoices(); const select = document.getElementById('voiceSelect'); select.innerHTML = ''; voices.forEach((v, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = v.name + (v.lang ? ` (${v.lang})` : ''); select.appendChild(opt); }); }
        loadVoices(); if (speechSynthesis.onvoiceschanged) speechSynthesis.onvoiceschanged = loadVoices;
        function speak() { if (synth.speaking) synth.cancel(); const text = document.getElementById('textInput').value; if (!text) return; const utt = new SpeechSynthesisUtterance(text); utt.voice = voices[document.getElementById('voiceSelect').value]; utt.rate = document.getElementById('rateRange').value; utt.pitch = document.getElementById('pitchRange').value; synth.speak(utt); }
        function stop() { synth.cancel(); }
        function clearText() { document.getElementById('textInput').value = ''; }
    </script>
</body>
</html>
