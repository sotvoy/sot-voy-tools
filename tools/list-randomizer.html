<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Randomizer - Shuffle List Items</title>
    <meta name="description" content="Randomize and shuffle list items instantly. Free online list randomizer tool.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/list-randomizer.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        <div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>List Randomizer</h1><p>Shuffle and randomize list items</p></div>
                <div class="tool-content">
                    <div class="form-group">
                        <label class="tool-label">Enter items (one per line)</label>
                        <textarea id="inputList" class="tool-textarea" placeholder="Item 1&#10;Item 2&#10;Item 3&#10;..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="tool-label">Number of items to pick</label>
                        <input type="number" id="pickCount" class="tool-input" value="1" min="1">
                    </div>
                    <div class="tool-actions">
                        <button class="tool-btn" onclick="shuffleList()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                            Shuffle All
                        </button>
                        <button class="tool-btn" onclick="pickRandom()">Pick Random</button>
                        <button class="tool-btn secondary" onclick="clearList()">Clear</button>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <label class="tool-label">Result</label>
                        <textarea id="outputList" class="tool-textarea" readonly></textarea>
                    </div>
                </div>
                <div class="tool-info"><h3>Use Cases</h3><ul><li>Randomly select winners</li><li>Shuffle team orders</li><li>Pick random tasks</li><li>Randomize survey questions</li></ul></div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        function shuffleList() {
            const items = document.getElementById('inputList').value.split('\n').filter(i => i.trim());
            for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
            document.getElementById('outputList').value = items.join('\n');
        }
        function pickRandom() {
            const items = document.getElementById('inputList').value.split('\n').filter(i => i.trim());
            const count = Math.min(parseInt(document.getElementById('pickCount').value) || 1, items.length);
            const selected = []; for (let i = 0; i < count; i++) { const idx = Math.floor(Math.random() * items.length); selected.push(items.splice(idx, 1)[0]); }
            document.getElementById('outputList').value = selected.join('\n');
        }
        function clearList() { document.getElementById('inputList').value = ''; document.getElementById('outputList').value = ''; }
    </script>
</body>
</html>
