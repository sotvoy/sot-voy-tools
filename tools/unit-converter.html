<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Free Online Unit Converter</title>
    <meta name="description" content="Convert between units of length, weight, temperature, and more. Free online unit converter.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/unit-converter.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-page { padding: 40px 0; }
        .tool-container { max-width: 600px; margin: 0 auto; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
        .tool-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; }
        .form-group select, .form-group input { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; }
        .result { padding: 24px; background: var(--surface-hover); border-radius: var(--radius); text-align: center; margin-top: 20px; }
        .result-value { font-size: 32px; font-weight: 700; color: var(--primary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        <div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Unit Converter</h1><p>Convert between different units</p></div>
                <div class="tool-content">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" onchange="updateUnits()">
                            <option value="length">Length</option>
                            <option value="weight">Weight</option>
                            <option value="temperature">Temperature</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>From</label>
                        <input type="number" id="inputValue" placeholder="Enter value" oninput="convert()">
                        <select id="fromUnit" onchange="convert()" style="margin-top:8px"></select>
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <select id="toUnit" onchange="convert()"></select>
                    </div>
                    <div class="result"><div class="result-value" id="resultValue">0</div></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        const units = {
            length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.344, ft: 0.3048, in: 0.0254 },
            weight: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.0283495 },
            temperature: { C: 'C', F: 'F', K: 'K' }
        };
        function updateUnits() {
            const cat = document.getElementById('category').value;
            const from = document.getElementById('fromUnit');
            const to = document.getElementById('toUnit');
            from.innerHTML = to.innerHTML = Object.keys(units[cat]).map(u => `<option value="${u}">${u}</option>`).join('');
        }
        function convert() {
            const cat = document.getElementById('category').value;
            const val = parseFloat(document.getElementById('inputValue').value) || 0;
            const from = document.getElementById('fromUnit').value;
            const to = document.getElementById('toUnit').value;
            let result;
            if (cat === 'temperature') {
                let c = from === 'C' ? val : from === 'F' ? (val-32)*5/9 : val - 273.15;
                result = to === 'C' ? c : to === 'F' ? c*9/5+32 : c + 273.15;
            } else {
                result = val * units[cat][from] / units[cat][to];
            }
            document.getElementById('resultValue').textContent = result.toFixed(6);
        }
        updateUnits();
    </script>
</body>
</html>
