<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter - Free Online Text Case Converter</title>
    <meta name="description" content="Convert text to uppercase, lowercase, title case, and more. Free online case converter tool.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/case-converter.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-page { padding: 40px 0; }
        .tool-container { max-width: 800px; margin: 0 auto; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
        .tool-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
        .tool-textarea { width: 100%; min-height: 150px; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; color: var(--text); resize: vertical; margin-bottom: 16px; }
        .case-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .case-btn { padding: 10px 16px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: var(--radius); font-weight: 500; cursor: pointer; }
        .case-btn:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        <div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Case Converter</h1><p>Convert text between different cases</p></div>
                <div class="tool-content">
                    <textarea id="textInput" class="tool-textarea" placeholder="Enter text to convert..."></textarea>
                    <div class="case-btns">
                        <button class="case-btn" onclick="convertCase('upper')">UPPERCASE</button>
                        <button class="case-btn" onclick="convertCase('lower')">lowercase</button>
                        <button class="case-btn" onclick="convertCase('title')">Title Case</button>
                        <button class="case-btn" onclick="convertCase('sentence')">Sentence case</button>
                        <button class="case-btn" onclick="convertCase('toggle')">tOGGLE cASE</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        function convertCase(type) {
            const input = document.getElementById('textInput');
            let text = input.value;
            switch(type) {
                case 'upper': input.value = text.toUpperCase(); break;
                case 'lower': input.value = text.toLowerCase(); break;
                case 'title': input.value = text.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase()); break;
                case 'sentence': input.value = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()); break;
                case 'toggle': input.value = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join(''); break;
            }
        }
    </script>
</body>
</html>
