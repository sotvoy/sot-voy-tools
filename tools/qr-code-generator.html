<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Free Online QR Code Creator</title>
    <meta name="description" content="Generate QR codes for URLs, text, WiFi, and more. Free online QR code generator - no download required.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/qr-code-generator.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-page { padding: 40px 0; }
        .tool-container { max-width: 700px; margin: 0 auto; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
        .tool-header p { color: var(--text-secondary); }
        .tool-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; }
        .tool-input { width: 100%; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; color: var(--text); margin-bottom: 20px; }
        .tool-input:focus { outline: none; border-color: var(--primary); }
        .qr-result { text-align: center; padding: 24px; background: var(--surface-hover); border-radius: var(--radius); margin-top: 20px; }
        .qr-result canvas { max-width: 100%; }
        .tool-btn { padding: 14px 28px; background: var(--gradient-primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; }
        .tool-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop">
                    <a href="../index.html#tools" class="nav-link">Tools</a>
                    <a href="../index.html#categories" class="nav-link">Categories</a>
                </nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme">
                            <svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        </button>
                        <div class="theme-dropdown">
                            <button class="theme-option active" data-theme="system">System</button>
                            <button class="theme-option" data-theme="light">Light</button>
                            <button class="theme-option" data-theme="dark">Dark</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>QR Code Generator</h1><p>Create QR codes for URLs, text, WiFi, and more</p></div>
                <div class="tool-content">
                    <input type="text" id="qrInput" class="tool-input" placeholder="Enter URL or text...">
                    <button class="tool-btn" onclick="generateQR()">Generate QR Code</button>
                    <div class="qr-result" id="qrResult"></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></div></footer>
    <script src="../js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        function generateQR() {
            const input = document.getElementById('qrInput').value;
            const result = document.getElementById('qrResult');
            if (!input) { result.innerHTML = '<p>Please enter some text or URL</p>'; return; }
            result.innerHTML = '';
            QRCode.toCanvas(input, { width: 250, margin: 2 }, (err, canvas) => {
                if (err) { result.innerHTML = '<p>Error generating QR code</p>'; return; }
                result.appendChild(canvas);
            });
        }
    </script>
</body>
</html>
