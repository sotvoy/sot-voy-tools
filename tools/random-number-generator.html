<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator - Free Online RNG</title>
    <meta name="description" content="Generate random numbers instantly. Free online random number generator with min/max range.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/random-number-generator.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-page.css">
</head>
<body>
    <div class="bg-shapes"><div class="bg-shape bg-shape-1"></div><div class="bg-shape bg-shape-2"></div><div class="bg-shape bg-shape-3"></div></div>
    <header class="header">
        <div class="container"><div class="header-inner">
            <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
            <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
            <div class="header-actions"><div class="theme-toggle-wrap"><button class="theme-toggle"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button><div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div></div><button class="mobile-menu-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
        </div></div>
    </header>
    <div class="mobile-menu"><a href="#tools" class="mobile-nav-link">Tools</a><a href="#categories" class="mobile-nav-link">Categories</a><div class="mobile-theme-options"><button class="mobile-theme-btn" data-theme="system">System</button><button class="mobile-theme-btn" data-theme="light">Light</button><button class="mobile-theme-btn" data-theme="dark">Dark</button></div></div>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Random Number Generator</h1><p>Generate random numbers within a range</p></div>
                <div class="tool-content">
                    <div class="form-group"><label>Minimum Number</label><input type="number" id="minNum" value="1" oninput="generate()"></div>
                    <div class="form-group"><label>Maximum Number</label><input type="number" id="maxNum" value="100" oninput="generate()"></div>
                    <div class="form-group"><label>How many numbers?</label><input type="number" id="count" value="1" min="1" max="100" oninput="generate()"></div>
                    <button class="tool-btn" onclick="generate()">Generate Random Number</button>
                    <div class="result"><div class="result-value" id="result">-</div><div class="result-label">Random Number(s)</div></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer-simple"><div class="container"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        function generate() {
            const min = parseInt(document.getElementById('minNum').value) || 1;
            const max = parseInt(document.getElementById('maxNum').value) || 100;
            const count = parseInt(document.getElementById('count').value) || 1;
            const numbers = [];
            for(let i=0; i<Math.min(count, 100); i++) {
                numbers.push(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            document.getElementById('result').textContent = numbers.join(', ');
        }
        generate();
    </script>
</body>
</html>
