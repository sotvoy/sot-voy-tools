<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder - Free Online Base64 Tool</title>
    <meta name="description" content="Encode and decode Base64 strings online. Free Base64 encoder and decoder tool.">
    <link rel="canonical" href="https://sot-voy-tools.com/tools/base64-encoder.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-page { padding: 40px 0; }
        .tool-container { max-width: 800px; margin: 0 auto; }
        .tool-header { text-align: center; margin-bottom: 40px; }
        .tool-header h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
        .tool-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
        .tool-textarea { width: 100%; min-height: 120px; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-family: monospace; font-size: 14px; color: var(--text); resize: vertical; margin-bottom: 16px; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .action-btn { padding: 12px 20px; background: var(--gradient-primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; }
        .action-btn.secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo"><div class="logo-icon">S</div><span>SOT VOY Tools</span></a>
                <nav class="nav-desktop"><a href="../index.html#tools" class="nav-link">Tools</a><a href="../index.html#categories" class="nav-link">Categories</a></nav>
                <div class="header-actions">
                    <div class="theme-toggle-wrapper">
                        <button class="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        <div class="theme-dropdown"><button class="theme-option" data-theme="system">System</button><button class="theme-option" data-theme="light">Light</button><button class="theme-option" data-theme="dark">Dark</button></div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="tool-page">
        <div class="container">
            <div class="tool-container">
                <div class="tool-header"><h1>Base64 Encoder/Decoder</h1><p>Encode and decode Base64 strings</p></div>
                <div class="tool-content">
                    <textarea id="input" class="tool-textarea" placeholder="Enter text to encode or decode..."></textarea>
                    <div class="action-btns">
                        <button class="action-btn" onclick="encode()">Encode</button>
                        <button class="action-btn" onclick="decode()">Decode</button>
                        <button class="action-btn secondary" onclick="copy()">Copy</button>
                        <button class="action-btn secondary" onclick="clear()">Clear</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SOT VOY Tools. All rights reserved.</p></div></footer>
    <script src="../js/theme.js"></script>
    <script>
        function encode() {
            try {
                document.getElementById('input').value = btoa(document.getElementById('input').value);
            } catch(e) { alert('Invalid input for encoding'); }
        }
        function decode() {
            try {
                document.getElementById('input').value = atob(document.getElementById('input').value);
            } catch(e) { alert('Invalid Base64 for decoding'); }
        }
        function copy() { navigator.clipboard.writeText(document.getElementById('input').value); }
        function clear() { document.getElementById('input').value = ''; }
    </script>
</body>
</html>
